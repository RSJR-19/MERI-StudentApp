<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERI - Budget</title>
    <link rel="stylesheet" href="/app/static/css/style.css">
    <link rel="stylesheet" href="/app/static/css/budget/budget.css">
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
</head>
<body>
    <div id="container">
        <div class="upper-space"></div>
        <div id="mainContentContainer">
            <div id="budgetContainer">
                <button id="addBudgetState">
                    <p>ADD BUDGET TODAY</p>
                    <span class="material-symbols-outlined">add_2</span>
                </button>
                <div id="withBudgetStateHeader">
                    <p class="title-header">AVAILABLE BUDGET</p>
                    <p id="budgetLeft">₱200.00</p>
                    <div class="progress-bar">
                        <div id="progress"></div>
                    </div>
                    <div class="budget-div">
                        <p>₱200 spent</p>
                        <p>₱400 total</p>
                    </div>
                    <button id="updateBudgetBtn">
                        <span class="material-symbols-outlined">add_2</span>
                    </button>
                </div>
            </div>
            <div class="content-container">
                <div id="emptyBudgetState">
                    <p>SET BUDGET FIRST</p>
                     <span class="material-symbols-outlined">error</span>   
                </div>
                <div id="withBudgetStateMain">
                    <div class="expense-item-container">
                    <div class="expense-item">
                        <div class="expense-group">
                            <p class="expense-item-title">Food Ni Mimi at ni Ate Carly - MAMA</p>
                            <p class="expense-price">₱20.00</p>
                        </div>
                        <p class="expense-details">pagkain para sa masumngit na posa</p>
                    </div>
                    </div>
                    <button id="addExpenseBtn">+ Log Expense</button>

                </div>
            </div>
        </div>
        <div id="navBar">
            <span class="material-symbols-outlined function-icon" id="budgetBtn">payments</span>
            <span class="material-symbols-outlined function-icon" id="scheduleBtn">schedule</span>
            <span class="material-symbols-outlined" id="homeBtn">home</span>
            <span class="material-symbols-outlined function-icon" id="toDoBtn">checklist</span>
            <span class="material-symbols-outlined function-icon" id="reviewBtn">newsstand</span>
        </div>
        <div id="blurOverlay"></div>

    </div>
    
</body>
</html>
